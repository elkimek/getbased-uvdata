# Self-host quickstart:
#   1. Copy .env.example → .env, fill in CAMS_API_KEY + GETBASED_UVDATA_BEARER.
#   2. docker compose up -d
#   3. Front it with TLS via your reverse proxy (Caddy / nginx / Cloudflare).
#      The container binds to 127.0.0.1:8324 only — never directly exposed
#      to the public internet without a TLS terminator + rate-limiter
#      between it and the world. Caddy snippet:
#
#         uvdata.getbased.health {
#           reverse_proxy localhost:8324
#         }
#   4. Point Settings → Light & Sun → Sun Data Source at:
#        https://<your-host>/uv  with the bearer you set above.

services:
  uvdata:
    build: .
    image: getbased/uvdata:0.1.0
    restart: unless-stopped
    env_file: .env
    # 127.0.0.1 binding — public access goes through the host's reverse
    # proxy, so the container never speaks raw HTTP to the internet.
    # Self-hosters who want direct exposure (LAN-only, behind a separate
    # firewall) can override to "0.0.0.0:8324:8324".
    ports:
      - "127.0.0.1:8324:8324"
    volumes:
      - cams-cache:/data
    # Memory cap — hard ceiling on the container's RSS so a pull
    # spike can never starve other services on the same host (evolu-
    # relay / context-gateway co-tenancy). Steady state stays around
    # 150-250 MB; the transient peak hits during the CAMS pull when
    # the 234 MB zip is decoded by xarray with all four AQ variables
    # in flight (peaks observed at ~900 MB-1.1 GB on the global grid).
    # Earlier 512m cap was sized for the single-variable snapshot
    # before PM2.5/PM10/AQ added; OOM-killed every pull mid-decode
    # (auto-restart cleaned up the staging dir via the v0.1.1 sweep,
    # but the snapshot never landed). 1500m leaves comfortable
    # headroom on a 2 GB VPS while still capping a runaway.
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  cams-cache:

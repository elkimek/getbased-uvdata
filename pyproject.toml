[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getbased-uvdata"
version = "0.1.5"
description = "CAMS atmospheric data → Open-Meteo-shaped UV/atmosphere JSON for the getbased.health Light & Sun module."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "elkimek" }]
dependencies = [
  "fastapi>=0.110,<0.137",
  "uvicorn[standard]>=0.27,<0.50",
  "httpx>=0.27,<0.30",
  "cdsapi>=0.7,<0.10",
  "xarray>=2024.0,<2027.0",
  "netCDF4>=1.6,<2.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
getbased-uvdata = "getbased_uvdata.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getbased-uvdata"
version = "0.1.0"
description = "CAMS atmospheric data → Open-Meteo-shaped UV/atmosphere JSON for the getbased.health Light & Sun module."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "elkimek" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "cdsapi>=0.7",
  "xarray>=2024.0",
  "netCDF4>=1.6",
  "numpy>=1.26",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
getbased-uvdata = "getbased_uvdata.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
